name: jaringan-kasih-local

services:
  api:
    build:
      context: ./backend
    working_dir: /var/www/html
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--no-reload"]
    env_file:
      - ./backend/.env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jaringan_kasih
      POSTGRES_USER: jaringan_kasih
      POSTGRES_PASSWORD: jaringan_kasih_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-testing.sql:/docker-entrypoint-initdb.d/10-testing.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jaringan_kasih -d jaringan_kasih"]
      interval: 5s
      timeout: 5s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres_data:
  backend_vendor:
